[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oni-re"
version = "0.2.0rc1"
description = "Offline source architecture analysis: rank central code and draft evidence-based adoption plans."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "AkuchiS" }]
keywords = ["reverse-engineering", "repo-map", "code-analysis", "pagerank", "teardown", "static-analysis", "developer-tools", "codebase-understanding", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Documentation",
    "Intended Audience :: Developers",
]
dependencies = []  # stdlib only — that's the whole point

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
oni = "oni.cli:main"
oni-mcp = "oni.mcp:main"

[project.urls]
Homepage = "https://github.com/AkuchiS/Oni"
Source = "https://github.com/AkuchiS/Oni"
Documentation = "https://github.com/AkuchiS/Oni#readme"
Issues = "https://github.com/AkuchiS/Oni/issues"
Changelog = "https://github.com/AkuchiS/Oni/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["oni"]

[tool.setuptools.package-data]
oni = []

[tool.pytest.ini_options]
# only collect oni's own suite — fixtures/ is sample data (a mini-repo oni tears down), not tests
testpaths = ["tests"]
