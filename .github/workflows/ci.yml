name: ci
permissions:
  contents: read
# The suite existed but nothing ever ran it — same gap that let a broken build ship elsewhere.
# Tests are fully offline (bundled fixture repo), so this needs no network and no secrets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: macos-latest      # 3.8 isn't available on the arm64 runners
            python: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (dev extra = pytest; oni itself has no runtime deps)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Tests (offline)
        run: pytest -q

  zero-deps:
    # oni's headline claim is "pure stdlib, zero dependencies". Assert it instead of trusting the
    # README — a wheel that quietly grows a dependency would otherwise ship unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the wheel
        run: python -m pip install -U pip build packaging && python -m build
      - name: Assert ZERO runtime dependencies
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          meta = zipfile.ZipFile(whl).read(
              [n for n in zipfile.ZipFile(whl).namelist() if n.endswith("METADATA")][0]).decode()
          from packaging.requirements import Requirement
          from packaging.markers import default_environment
          reqs = [Requirement(l.split(":", 1)[1].strip())
                  for l in meta.splitlines() if l.startswith("Requires-Dist:")]
          # Empty extra selects the base install. Evaluate across supported environments,
          # including platform/python-specific requirements rather than just this runner.
          runtime = set()
          for python in ("3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"):
              for platform, os_name, system in (("linux", "posix", "Linux"),
                                                  ("darwin", "posix", "Darwin"),
                                                  ("win32", "nt", "Windows")):
                  env = dict(default_environment(), extra="", python_version=python,
                             python_full_version=python + ".0", sys_platform=platform,
                             os_name=os_name, platform_system=system)
                  runtime.update(str(r) for r in reqs if not r.marker or r.marker.evaluate(env))
          assert not runtime, "Runtime dependencies found: %s" % sorted(runtime)
          print("zero-dep wheel OK:", whl)
          PY
      - name: Install wheel in a clean environment and exercise the CLI
        shell: bash
        run: |
          python -m venv /tmp/oni-wheel
          /tmp/oni-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/oni-wheel/bin/oni --version
          /tmp/oni-wheel/bin/oni "$GITHUB_WORKSPACE/fixtures/tinyrepo" --offline --json > oni-smoke.json
          /tmp/oni-wheel/bin/python -c 'import json; d=json.load(open("oni-smoke.json")); assert d["target"] == "tinyrepo"; assert d["teardown"]["_model"] is None'
      - name: Exercise installed MCP entry point
        run: python scripts/smoke_mcp.py /tmp/oni-wheel/bin/oni-mcp fixtures/tinyrepo
      - uses: actions/upload-artifact@v4
        with:
          name: oni-distributions
          path: dist/*
